apiVersion: apps/v1
kind: Deployment
metadata:
  name: conscious-subconscious-api
  namespace: conscious-subconscious
  labels:
    app.kubernetes.io/name: conscious-subconscious
    app.kubernetes.io/component: api
spec:
  # Two replicas because the simulation is stateless per request and the SQLite
  # file is a single-writer convenience store, not a source of truth. With the
  # emptyDir below, two replicas means two independent scratch directories —
  # see deploy/README.md before treating this as durable.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: conscious-subconscious
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conscious-subconscious
        app.kubernetes.io/component: api
    spec:
      # The service never talks to the Kubernetes API, so it has no reason to
      # hold a token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/onegayunicorn/conscious-subconscious:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: conscious-subconscious-config
            - secretRef:
                name: conscious-subconscious-secrets
                # Required. The API needs CS_API_KEY to exist; if the secret is
                # missing the pod should fail loudly rather than start up
                # unauthenticated. (While the service layer is unimplemented,
                # this pod will fail on the missing entry point instead — see
                # deploy/README.md.)
                optional: false
          resources:
            # Requests are honest, low, and based on running the simulation
            # locally. Limits are deliberately generous on CPU because a sweep
            # is CPU-bound; they are NOT the result of load testing, because no
            # load testing has been done.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          # /healthz is liveness: "the process is up". /readyz is readiness:
          # "this instance can serve requests" (it may, for example, be waiting
          # on the data directory). The two are separate endpoints on purpose;
          # using one for both is how a restart loop starts.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem means anything that writes to the root
            # filesystem fails. Python and the SQLite driver both want a scratch
            # directory; /tmp is mounted explicitly rather than relaxing the
            # read-only root.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
