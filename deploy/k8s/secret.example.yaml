# ============================================================================
# EXAMPLE ONLY. EVERY VALUE IN THIS FILE IS A PLACEHOLDER.
#
# Do NOT `kubectl apply` this file. Do not replace the placeholders and commit
# the result. This file exists to document which keys the service expects, not
# to provide them.
#
# Create the real secret out of band, for example:
#
#   kubectl -n conscious-subconscious create secret generic \
#     conscious-subconscious-secrets \
#     --from-literal=CS_API_KEY="$(openssl rand -hex 32)"
#
# or seal it with the project's tool of choice (Sealed Secrets, SOPS,
# External Secrets). Nothing in this repository writes, reads or manages a real
# secret store.
#
# If CS_API_KEY is empty the API service (once it exists) refuses to bind to a
# non-loopback interface and logs a loud warning. That is deliberate: an
# unauthenticated simulation service should not be reachable off-box.
#
# A leak of this value is covered by security/incident-response.md.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: conscious-subconscious-secrets
  namespace: conscious-subconscious
  labels:
    app.kubernetes.io/name: conscious-subconscious
    app.kubernetes.io/component: api
  annotations:
    conscious-subconscious/example: "true"
    conscious-subconscious/do-not-apply: "true"
type: Opaque
stringData:
  # Shared secret required in the `X-API-Key` header for every /v1 route.
  CS_API_KEY: "REPLACE_ME_WITH_A_RANDOM_VALUE"
